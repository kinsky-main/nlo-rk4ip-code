[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nlolib"
version = "1.20.0"
description = "Nonlinear optics runtime wrapper with bundled nlolib shared libraries."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
  {name = "Wenzel Kinsky"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Scientific/Engineering"
]

[project.urls]
Documentation = "https://kinsky-main.github.io/nlo-rk4ip-code/"
Source = "https://github.com/kinsky-main/nlolib-python"
"Core library" = "https://github.com/kinsky-main/nlo-rk4ip-code"

[tool.setuptools]
packages = ["nlolib", "nlolib.translate"]
include-package-data = true

[tool.setuptools.package-data]
nlolib = ["*.dll", "*.so", "*.dylib", "LICENSE*", "README*"]
