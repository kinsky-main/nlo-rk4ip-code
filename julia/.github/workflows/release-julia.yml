name: release-julia

# Builds the native library for every supported platform, packs each one as a
# Julia artifact tarball, proves the package works against the installed
# artifact rather than a build tree, and publishes the tarballs plus a
# ready-to-commit Artifacts.toml as GitHub release assets.
#
# The native library is built from the core nlolib sources, checked out at the
# revision CORE_REF pins.
#
# Why Artifacts.toml is not written by this workflow into the repository: an
# entry binds a git-tree-sha1 to a download URL and a tarball sha256, so it can
# only be written once the tarballs are published and their URLs exist. Rather
# than have CI push to a branch, the generated file ships as a release asset and
# a human commits it in a follow-up pull request -- see docs/release.md, which
# also covers the registration step. Nothing here talks to the General registry.
#
# The publish job is the only tag-gated step, so a workflow_dispatch run
# exercises everything except the upload.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:   # dry run: builds, tests and uploads artifacts, publishes nothing

permissions:
  contents: read

concurrency:
  group: release-julia-${{ github.ref }}
  cancel-in-progress: false

env:
  # The compat floor in Project.toml. Artifact tree hashes are computed
  # with this release, so the oldest Julia we claim to support is the one that
  # agreed the hashes.
  JULIA_VERSION: '1.10'

jobs:
  verify:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      core_ref: ${{ steps.core.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      # Project.toml is the source of truth for this package's version, which is
      # released independently of the core library. The tag is a bare version
      # and has to equal it: the published artifacts carry the version from
      # the file, so a tag that disagreed would name something else. The check
      # runs on a dispatch run too, because that run is the rehearsal for the
      # tag; only the tag comparison itself is conditional.
      - name: Check the version and the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="$(python3 tools/check_version.py --tag "${GITHUB_REF_NAME}")"
          else
            version="$(python3 tools/check_version.py)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      # CORE_REF pins the core library revision this release is built from. A
      # full commit SHA, not a branch or tag, so the same tag here always
      # builds the same native library.
      - name: Read the pinned core revision
        id: core
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < CORE_REF)"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::CORE_REF must hold a full 40-character commit SHA of kinsky-main/nlo-rk4ip-code, found '$ref'."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Core revision: $ref"

      - uses: actions/checkout@v4
        with:
          repository: kinsky-main/nlo-rk4ip-code
          ref: ${{ steps.core.outputs.ref }}
          path: core

      # The version check above only compares strings. These two gate the other
      # things a release tree has to have right: the core's sbom.cdx.json is the
      # bill of materials for the pinned dependencies compiled into the binaries
      # this tag publishes, and this binding re-declares the C API enums and
      # limits in its own source with no compile-time link to the header, so a
      # tag could otherwise ship a binding that disagrees with the library it
      # loads. Both read source text and need no build.
      - name: Check the core SBOM pins and the binding API constants
        shell: bash
        run: |
          set -euo pipefail
          python3 core/tools/write_sbom.py --check
          python3 core/tools/check_api_parity.py --bindings julia --julia-dir .

  build:
    name: Build ${{ matrix.triplet }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not -latest:
          # ubuntu-26.04 ships a GCC that will not compile our pinned glslang.
          - os: ubuntu-24.04
            triplet: x86_64-linux-gnu
          - os: windows-2025
            triplet: x86_64-w64-mingw32
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The core library sources, at the revision CORE_REF pins.
      - uses: actions/checkout@v4
        with:
          repository: kinsky-main/nlo-rk4ip-code
          ref: ${{ needs.verify.outputs.core_ref }}
          path: core

      # The Vulkan backend needs the loader import library and glslangValidator
      # at build time. CMake fetches the headers itself, but errors out on these.
      - name: Install Vulkan loader and glslang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslang-tools

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe' -OutFile $installer
          $installArgs = @('--accept-licenses', '--default-answer', '--confirm-command', 'install')
          $proc = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($proc.ExitCode)" }
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'No Vulkan SDK directory found after install' }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # runner-images currently routes every Windows label to Visual Studio 2026
      # (actions/runner-images#14571). The CRT is linked statically
      # (CMAKE_MSVC_RUNTIME_LIBRARY in the core CMakeLists.txt), so this is not
      # about redistributables: the MATLAB toolbox release pins VS 2022 because
      # MATLAB will not accept VS 2026, and pinning the same toolchain here
      # keeps every shipped Windows nlolib.dll coming off one compiler we have
      # tested, instead of releasing a Julia binary from an untried one.
      - name: Install Visual Studio 2022 build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install visualstudio2022buildtools -y --no-progress --ignore-package-exit-codes `
            --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows11SDK.26100 --includeRecommended --quiet --norestart --nocache"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw 'Visual Studio 2022 with the C++ toolset was not installed' }
          Write-Host "Visual Studio 2022 at $installPath"
          "CMAKE_GENERATOR=Visual Studio 17 2022" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      # nlo_configure_verified fails if any -D did not reach the project; the
      # option names are unprefixed and a misspelled one is silently ignored.
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          source tools/cmake_options.sh
          options=(
            INSTALL_GIT_HOOKS=OFF
            BUMP_PATCH_ON_BUILD=OFF
            BUILD_TESTING=OFF
            NLOLIB_BUILD_DOCS=OFF
            NLOLIB_BUILD_BENCHMARKS=OFF
            NLOLIB_BUILD_EXAMPLES=OFF
            ENABLE_VULKAN_BACKEND=ON
            ENABLE_VKFFT=ON
            SQLITE_USE_FETCHCONTENT=ON
          )
          # The Visual Studio generator is multi-config, so it never reads
          # CMAKE_BUILD_TYPE and leaves it UNINITIALIZED in the cache, which
          # nlo_configure_verified correctly rejects. --config Release on the
          # build command picks the configuration there.
          if [ "$RUNNER_OS" != "Windows" ]; then
            options+=(CMAKE_BUILD_TYPE=Release)
          fi
          # NLOLIB_JULIA_DIR points the core build at this checkout, which is
          # what creates the julia_stage target. Passed unverified: CMake
          # normalises the path, so it would not compare equal as a string.
          NLO_SOURCE_DIR=core
          NLO_EXTRA_CMAKE_ARGS=("-DNLOLIB_JULIA_DIR=${GITHUB_WORKSPACE}")
          nlo_configure_verified build "${options[@]}"

      - name: Stage the Julia package
        run: cmake --build build --config Release --parallel --target julia_stage

      # The artifact must carry the library's runtime dependencies, which
      # julia_stage copies next to it via the core's cmake/copy_runtime_deps.cmake. Print
      # the staged tree and the library's dependencies so a dry run shows
      # exactly what users would download.
      - name: Inspect the staged library
        shell: bash
        run: |
          set -euo pipefail
          ls -l build/julia_package/lib
          test -f build/julia_package/lib/nlolib.h
          if [ "$RUNNER_OS" = "Linux" ]; then
            test -f build/julia_package/lib/libnlolib.so
            ldd build/julia_package/lib/libnlolib.so
          else
            test -f build/julia_package/lib/nlolib.dll
          fi

      - name: Pack the artifact tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tarball="dist/nlolib-julia-${VERSION}-${{ matrix.triplet }}.tar.gz"
          tar -czf "$tarball" -C build/julia_package lib
          ls -l "$tarball"

      # The git tree hash of an unpacked tarball is not platform independent, so
      # each platform's hash is computed here, on the platform that consumes it,
      # and the bundle job only merges the resulting fragments.
      - name: Bind the artifact fragment
        shell: bash
        run: |
          set -euo pipefail
          julia tools/bind_artifacts.jl \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --toml "dist/artifacts-${{ matrix.triplet }}.toml" \
            "${{ matrix.triplet }}=dist/nlolib-julia-${VERSION}-${{ matrix.triplet }}.tar.gz"
          cat "dist/artifacts-${{ matrix.triplet }}.toml"

      - uses: actions/upload-artifact@v4
        with:
          name: julia-${{ matrix.triplet }}
          path: |
            dist/nlolib-julia-*.tar.gz
            dist/artifacts-*.toml
          if-no-files-found: error

  test:
    name: Test ${{ matrix.triplet }} on Julia ${{ matrix.julia }}
    needs: [verify, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x86_64-linux-gnu
            julia: '1.10'
          - os: ubuntu-24.04
            triplet: x86_64-linux-gnu
            julia: '1'
          - os: windows-2025
            triplet: x86_64-w64-mingw32
            julia: '1.10'
          - os: windows-2025
            triplet: x86_64-w64-mingw32
            julia: '1'
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # A plain checkout with no build directory: none of the development
      # fallback paths in src/lib.jl exist here, so the library can only
      # come from the artifact.
      - uses: actions/checkout@v4

      # Windows delay-loads vulkan-1.dll, but on Linux the loader is a plain
      # NEEDED dependency and is deliberately not bundled, because it belongs to
      # the system. The runners have no GPU; the tests force the CPU backend.
      - name: Install the Vulkan loader (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - uses: actions/download-artifact@v4
        with:
          name: julia-${{ matrix.triplet }}
          path: dist

      # Recomputing the hash here, on a different machine from the build job,
      # and comparing with the fragment it produced is the check that the
      # published bindings are reproducible.
      - name: Install the artifact and check the binding reproduces
        shell: bash
        run: |
          set -euo pipefail
          julia tools/bind_artifacts.jl \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --install \
            --toml Artifacts.toml \
            "${{ matrix.triplet }}=dist/nlolib-julia-${VERSION}-${{ matrix.triplet }}.tar.gz"
          if ! diff -u "dist/artifacts-${{ matrix.triplet }}.toml" Artifacts.toml; then
            echo "::error::The artifact hash computed here differs from the one the build job published."
            exit 1
          fi

      - name: Check the library loads from the artifact
        shell: bash
        run: |
          set -euo pipefail
          julia --project=. tools/check_artifact_load.jl

      # test/runtests.jl pins backend_type = VECTOR_BACKEND_CPU and
      # fft_backend = FFT_BACKEND_FFTW for every propagation, so nothing here
      # needs a GPU or a Vulkan driver at runtime.
      - name: Run the package tests against the artifact
        shell: bash
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  bundle:
    name: Bundle Artifacts.toml
    needs: [verify, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          pattern: julia-*
          merge-multiple: true
          path: dist

      - name: Merge the per-platform fragments
        shell: bash
        run: |
          set -euo pipefail
          julia tools/bind_artifacts.jl --merge \
            --toml dist/Artifacts.toml \
            dist/artifacts-*.toml
          cd dist
          sha256sum nlolib-julia-*.tar.gz | tee SHA256SUMS

      - name: Summarise what to commit
        shell: bash
        run: |
          {
            echo "## Artifacts.toml for ${VERSION}"
            echo
            echo "Commit this file as Artifacts.toml, then register; see docs/release.md."
            echo
            echo '```toml'
            cat dist/Artifacts.toml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: julia-artifacts-toml
          path: |
            dist/Artifacts.toml
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: [verify, build, test, bundle]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: julia-*
          merge-multiple: true
          path: dist

      - name: Check what will be uploaded
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/artifacts-*.toml
          ls -l dist
          test -s dist/Artifacts.toml
          ls "dist/nlolib-julia-${VERSION}-x86_64-linux-gnu.tar.gz"
          ls "dist/nlolib-julia-${VERSION}-x86_64-w64-mingw32.tar.gz"

      # Creates the release if it does not exist yet and never edits its notes,
      # so a re-run after a partial upload only replaces the assets.
      - name: Upload the Julia assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(dist/Artifacts.toml dist/SHA256SUMS dist/nlolib-julia-*.tar.gz)
          for attempt in 1 2 3; do
            if gh release view "$VERSION" >/dev/null 2>&1; then
              gh release upload "$VERSION" "${assets[@]}" --clobber
              exit 0
            fi
            if gh release create "$VERSION" --title "Version $VERSION" \
                --notes "Release $VERSION." --latest "${assets[@]}"; then
              exit 0
            fi
            echo "release create failed on attempt $attempt; another workflow may have just created it"
            sleep 10
          done
          echo "::error::Could not publish the Julia release assets for ${VERSION}."
          exit 1
